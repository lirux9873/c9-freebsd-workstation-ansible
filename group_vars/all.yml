---
project_name: c9-freebsd-workstation-ansible
project_repository_url: >-
  https://github.com/lirux9873/c9-freebsd-workstation-ansible.git
project_repository_branch: main

supported_hardware_profiles:
  - virtualbox
  - dell_latitude_5591

supported_desktops:
  - sway
  - dwm

# This project is personal, so the workstation account is explicit.
# Change both values when using another account.
workstation_user: daniel
workstation_home: /home/daniel

freebsd_package_branch: latest
freebsd_upgrade_packages: true

base_packages:
  - ca_root_nss
  - git
  - sudo

base_services: []

base_sysrc_settings: {}

ansible_pull_enabled: false
ansible_pull_schedule:
  minute: "17"
  hour: "*/2"
ansible_pull_work_directory: /var/db/ansible-pull/c9-freebsd-workstation
ansible_pull_log_file: /var/log/ansible-pull.log
ansible_pull_lock_file: /var/run/c9-ansible-pull.lock
