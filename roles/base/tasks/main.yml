---
- name: Validate base role inputs
  ansible.builtin.assert:
    that:
      - ansible_facts["system"] == "FreeBSD"
      - freebsd_package_branch in ["quarterly", "latest"]

- name: Configure the FreeBSD package repository
  ansible.builtin.import_tasks: repository.yml

- name: Install baseline packages
  ansible.builtin.import_tasks: packages.yml

- name: Configure the workstation account
  ansible.builtin.import_tasks: users.yml

- name: Configure the sudo policy for wheel
  ansible.builtin.import_tasks: sudo.yml

- name: Configure baseline rc settings
  ansible.builtin.import_tasks: sysrc.yml

- name: Start baseline services
  ansible.builtin.import_tasks: services.yml
