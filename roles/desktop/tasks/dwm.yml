---
- name: Configure x session for dwm
  ansible.builtin.include_tasks: "dwm_xsession.yml"

- name: Configure picom
  ansible.builtin.include_tasks: "dwm_picom.yml"

- name: Install Dunst configuration
  ansible.builtin.template:
    src: dunstrc.j2
    dest: "{{ workstation_home }}/.config/dunst/dunstrc"
    owner: "{{ workstation_user }}"
    group: "{{ workstation_user }}"
    mode: "0644"
