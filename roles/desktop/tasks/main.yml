---
- name: Load selected desktop variables
  ansible.builtin.include_vars:
    file: "{{ desktop_environment }}.yml"

- name: Manage custom dwm installation directory
  block:
    - name: Ensure the ~/src directory exists
      ansible.builtin.file:
        path: "{{ ansible_env.HOME }}/src"
        state: directory
        mode: '0755'

    - name: Clone dwm-flexipatch repository
      ansible.builtin.git:
        repo: 'https://github.com'
        dest: "{{ ansible_env.HOME }}/src/dwm-flexipatch"
        version: master
        clone: yes
        update: yes
  when: desktop_environment  == 'dwm'

- name: Install desktop packages
  ansible.builtin.package:
    name: "{{ desktop_packages }}"
    state: present

- name: Create desktop configuration directories
  ansible.builtin.file:
    path: "{{ workstation_home }}/{{ item }}"
    state: directory
    owner: "{{ workstation_user }}"
    group: "{{ workstation_user }}"
    mode: "0755"
  loop: "{{ desktop_config_directories }}"

- name: Configure selected desktop
  ansible.builtin.include_tasks: "{{ desktop_environment }}.yml"
